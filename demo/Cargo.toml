[package]
name = "calorie-man-demo"
version = "0.1.0"
edition = "2021"
description = "Calorie Man compiled to WebAssembly: the real API and MCP router on an in-memory SQLite, for the GitHub Pages demo"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
calorie-man = { path = ".." }
axum = { version = "0.8", default-features = false, features = ["json"] }
chrono = { version = "0.4", features = ["wasmbind"] }
http-body-util = "0.1"
js-sys = "0.3"
serde_json = "1"
# SQLite's clock, randomness and local time come from the browser.
sqlite-wasm-rs = { version = "0.6.3", default-features = false, features = ["wasm-bindgen"] }
tower = { version = "0.5", features = ["util"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
