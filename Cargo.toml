[package]
name = "calorie-man"
version = "0.1.0"
edition = "2021"
description = "Local-network calorie, macro and micronutrient tracker with a web UI and an MCP server"
license = "MIT"
repository = "https://github.com/HackToHell/calorie-man"

[[bin]]
name = "calorie-man"
path = "src/main.rs"

[lib]
name = "calorie_man"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
iana-time-zone = "0.1"
mime_guess = "2"
r2d2 = "0.8"
r2d2_sqlite = "0.37"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
rusqlite = { version = "0.42", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
